<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Page</title>
</head>

<body>

    <div class="container">

        <h1>To-Do List</h1>

        <form action="/submittodoitem" method="POST">

            <label for="item_name">Item Name</label>

            <input
                type="text"
                id="item_name"
                name="item_name"
                placeholder="Enter item name"
                required
            >

            <label for="item_description">Item Description</label>

            <textarea
                id="item_description"
                name="item_description"
                placeholder="Enter item description"
                required
            ></textarea>

            <button type="submit">Add Item</button>

        </form>

    </div>

</body>

<style>

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 40px;
    }

    .container {
        width: 500px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input,
    textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    textarea {
        height: 120px;
        resize: vertical;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #0056b3;
    }

</style>

</html>
